<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<title>Sudoku</title>
<meta name="theme-color" content="#E8ECF1">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- themes ---------- */
:root{
  --page:#E8ECF1;--surface:#F7F9FB;--ink:#18212D;--dim:#525E6F;--line:#CDD4DD;
  --cell:#FCFDFE;--grid-thin:#B9C2CE;--grid-thick:#2A3442;--given:#18212D;--pen:#1A56C4;--note:#4A5768;
  --sel:#FFE597;--peer:#E9EDF3;--same:#D9E6FB;--err:#C4202E;--err-bg:#FBDADD;--key:#E2E7EE;--hint:#D6F0DD;--hint-ring:#1E8A45;
}
[data-theme="linen"]{
  --page:#ECE4D6;--surface:#F6F0E3;--ink:#2E261D;--dim:#5F5446;--line:#D6CBB8;
  --cell:#FBF7EC;--grid-thin:#CFC4B2;--grid-thick:#4A3F33;--given:#2E261D;--pen:#0A655B;--note:#5F5446;
  --sel:#FBE8B0;--peer:#F2EBDD;--same:#DDEDE7;--err:#B3261E;--err-bg:#F6D5CF;--key:#E7DFCF;--hint:#DDEBC6;--hint-ring:#4E7A1E;
}
[data-theme="sage"]{
  --page:#DCE6DE;--surface:#EEF4EF;--ink:#1E2B25;--dim:#495A52;--line:#C2D0C6;
  --cell:#F7FAF7;--grid-thin:#B5C5BA;--grid-thick:#2C4037;--given:#1E2B25;--pen:#98400F;--note:#4A5B53;
  --sel:#FCE9B4;--peer:#E7EFE9;--same:#F9E6D9;--err:#B3202C;--err-bg:#F7D6D8;--key:#D8E3DC;--hint:#DFF0F8;--hint-ring:#1F6F99;
}
[data-theme="contrast"]{
  --page:#FFFFFF;--surface:#FFFFFF;--ink:#000000;--dim:#3D3D3D;--line:#9A9A9A;
  --cell:#FFFFFF;--grid-thin:#8C8C8C;--grid-thick:#000000;--given:#000000;--pen:#0038C7;--note:#2B2B2B;
  --sel:#FFEC8A;--peer:#ECECEC;--same:#E0EAFF;--err:#C40018;--err-bg:#FFD9DE;--key:#E6E6E6;--hint:#D2F5D8;--hint-ring:#00702A;
}
[data-theme="dusk"]{
  --page:#121926;--surface:#1A2333;--ink:#E8EDF5;--dim:#94A1B5;--line:#2F3A4E;
  --cell:#1B2434;--grid-thin:#34405A;--grid-thick:#8793A8;--given:#E8EDF5;--pen:#8FBCFF;--note:#B4BFD0;
  --sel:#2A3D63;--peer:#222C3F;--same:#2A3B5C;--err:#FF7B86;--err-bg:#4A2029;--key:#253044;--hint:#1F4634;--hint-ring:#5FD08A;
}
[data-theme="chalk"]{
  --page:#1D2B26;--surface:#24362F;--ink:#F0EEE2;--dim:#A3B5AB;--line:#3A4F46;
  --cell:#24362F;--grid-thin:#3F564C;--grid-thick:#9DB0A6;--given:#F0EEE2;--pen:#FFD27A;--note:#C6D3CB;
  --sel:#36524A;--peer:#2A3E36;--same:#324B41;--err:#FF8A7A;--err-bg:#55302B;--key:#2F453C;--hint:#25405A;--hint-ring:#7FC4F0;
}
[data-theme="black"]{
  --page:#000000;--surface:#101012;--ink:#F2F2F3;--dim:#9A9AA0;--line:#2A2A2E;
  --cell:#0B0B0D;--grid-thin:#2C2C31;--grid-thick:#7A7A80;--given:#F2F2F3;--pen:#6FD0FF;--note:#B6B6BD;
  --sel:#23364F;--peer:#17171B;--same:#1E2A38;--err:#FF6B6B;--err-bg:#3D1717;--key:#1B1B1F;--hint:#16382A;--hint-ring:#4FD08A;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);height:100vh;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.screen[hidden]{display:none}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:24px;height:24px}
.icon-btn:active{background:var(--key)}

/* ---------- home ---------- */
#home{overflow-y:auto;padding:22px 16px 28px}
.home-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
h1{font-size:42px;font-weight:700;letter-spacing:-0.025em;margin:0;line-height:1}
.tag{color:var(--dim);margin:8px 0 0;font-size:15px;line-height:1.35}
.resume{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:22px}
.resume:active{background:var(--key)}
.thumb{width:84px;height:84px;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);gap:1px;background:var(--grid-thin);border:1.5px solid var(--grid-thick);flex:none}
.thumb i{background:var(--cell)}
.thumb i.g{background:var(--given)}
.thumb i.u{background:var(--pen)}
.resume b{display:block;font-size:19px;font-weight:700}
.resume span{display:block;color:var(--dim);font-size:15px;margin-top:3px}
h2.section{font-size:15px;font-weight:600;color:var(--dim);margin:26px 0 0;padding:0 4px 8px}
.levels{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.level{display:grid;grid-template-columns:26px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--line)}
.level:active{background:var(--surface)}
.glyph{width:26px;height:26px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px}
.glyph i{border-radius:2px;background:var(--line)}
.glyph i.on{background:var(--given)}
.level b{display:block;font-size:19px;font-weight:700}
.level span{display:block;color:var(--dim);font-size:14.5px;line-height:1.3;margin-top:2px}
.level em{font-style:normal;color:var(--dim);font-size:14px;text-align:right;white-space:nowrap}
.textlink{display:inline-block;margin:18px 4px 0;color:var(--pen);font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- game ---------- */
.bar{display:flex;align-items:center;gap:2px;padding:6px 6px 2px}
.bar-mid{flex:1;min-width:0;padding-left:2px}
.bar-level{font-weight:700;font-size:18px;line-height:1.15}
.bar-sub{font-size:13.5px;color:var(--dim);min-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sub.warn{color:var(--err)}
.timer{font-size:18px;font-weight:600;padding:0 4px;min-width:60px;text-align:right}
.board-wrap{flex:1 1 0;min-height:0;container-type:size;display:grid;place-items:center;margin:4px 10px;position:relative}
.board{width:min(100cqw,100cqh);height:min(100cqw,100cqh);container-type:inline-size;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;background:var(--grid-thick);border:2px solid var(--grid-thick);border-radius:5px;overflow:hidden}
.box{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:1px;background:var(--grid-thin);min-width:0;min-height:0}
.cell{background:var(--cell);display:grid;place-items:center;position:relative;font-size:6.8cqw;line-height:1;min-width:0;min-height:0;overflow:hidden}
.cell.given{color:var(--given);font-weight:800}
.cell.user{color:var(--given);font-weight:300}
[data-digits="colour"] .cell.given{font-weight:700}
[data-digits="colour"] .cell.user{color:var(--pen);font-weight:500}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same)}
.cell.err{color:var(--err);background:var(--err-bg)}
.cell.given.err{color:var(--given)}
.cell.sel{background:var(--sel);box-shadow:inset 0 0 0 2px var(--pen)}
.cell.h-unit{background:var(--hint)}
.cell.h-cell{background:var(--hint);box-shadow:inset 0 0 0 2px var(--hint-ring)}
.cell.h-pivot{box-shadow:inset 0 0 0 2px var(--hint-ring),inset 0 0 0 4px var(--hint),inset 0 0 0 6px var(--hint-ring)}
.cell.h-elim{box-shadow:inset 0 0 0 2px var(--err)}
.cell.h-target{background:var(--hint);box-shadow:inset 0 0 0 3px var(--hint-ring)}
.cell.h-target::after{content:"";position:absolute;inset:26%;border:2px solid var(--hint-ring);border-radius:50%}
.notes{position:absolute;inset:3%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:3.2cqw;color:var(--note);font-weight:500}
.notes span{display:grid;place-items:center}
.notes span.hi{color:var(--cell);background:var(--pen);border-radius:22%;font-weight:700}
@keyframes pulse{0%{background:var(--cell)}35%{background:var(--same)}100%{background:var(--cell)}}
.cell.fx-unit{animation:pulse .5s ease-out both;animation-delay:calc(var(--d,0)*28ms)}
@keyframes wave{0%{transform:scale(1)}30%{transform:scale(.82);background:var(--sel)}100%{transform:scale(1)}}
.cell.fx-win{animation:wave .6s ease-out both;animation-delay:calc(var(--d,0)*42ms)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6%)}75%{transform:translateX(6%)}}
.cell.fx-bad{animation:shake .22s linear 2}
.cover{position:absolute;inset:0;background:var(--page);display:grid;place-items:center;text-align:center;z-index:3}
.cover[hidden]{display:none}
.cover p{margin:0 0 14px;font-size:20px;font-weight:700}
.cover small{display:block;color:var(--dim);font-size:15px;font-weight:400;margin-top:6px}
.spinner{width:34px;height:34px;margin:0 auto 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.spinner i{background:var(--grid-thick);border-radius:2px;animation:blink 1.2s infinite both}
.spinner i:nth-child(2),.spinner i:nth-child(4){animation-delay:.12s}
.spinner i:nth-child(3),.spinner i:nth-child(5),.spinner i:nth-child(7){animation-delay:.24s}
.spinner i:nth-child(6),.spinner i:nth-child(8){animation-delay:.36s}
.spinner i:nth-child(9){animation-delay:.48s}
@keyframes blink{0%,60%,100%{opacity:.15}30%{opacity:1}}

.controls{padding:6px 10px 12px}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:10px;font-size:12.5px;color:var(--dim);position:relative}
.tool svg{width:24px;height:24px;color:var(--ink)}
.tool:active{background:var(--key)}
.tool.on{background:var(--pen);color:var(--cell)}
.tool.on svg{color:var(--cell)}
.tool:disabled{opacity:.32}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.key{height:clamp(54px,9.5vh,76px);border-radius:10px;background:var(--key);color:var(--pen);font-size:28px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1;border:1.5px solid transparent}
.key small{font-size:11.5px;color:var(--dim);font-weight:500;line-height:1}
.key:active{background:var(--same)}
.key.armed{background:var(--pen);color:var(--cell)}
.key.armed small{color:var(--cell)}
.key.done{opacity:.25}
.pad.noting .key{background:transparent;border:1.5px dashed var(--pen);font-size:22px}
.pad.noting .key.armed{background:var(--pen)}
.hintbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin:6px 10px 12px}
.hintbox h3{margin:0 0 6px;font-size:18px}
.hintbox h3 + .btns{margin-top:10px}
.hintbox p{margin:0 0 12px;font-size:16px;line-height:1.4;color:var(--ink)}
.hintbox .btns{display:flex;gap:8px;flex-wrap:wrap}
.hintbox .btn{flex:1 1 auto;width:auto;padding:11px 14px;font-size:16px}

/* ---------- sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(8,12,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.backdrop[hidden]{display:none}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:90vh;max-height:90dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:6px 18px calc(26px + env(safe-area-inset-bottom));animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-6px;background:var(--surface);padding:10px 0 6px;margin-top:-6px;z-index:1}
.sheet h2{font-size:23px;margin:0;letter-spacing:-0.01em}
.sheet h3{font-size:15px;font-weight:600;color:var(--dim);margin:22px 0 2px}
.sheet p{font-size:16px;line-height:1.45;margin:8px 0}
.sheet p.dim{color:var(--dim);font-size:15px}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;font-weight:600;font-size:17px;text-align:center;background:var(--key);color:var(--ink);margin-top:10px}
.btn.primary{background:var(--given);color:var(--cell)}
.btn.danger{color:var(--err)}
.btn:active{opacity:.75}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 2px;border-bottom:1px solid var(--line);font-size:17px}
.menu-item svg{width:22px;height:22px;flex:none}
.menu-item:last-child{border-bottom:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row > div:first-child{min-width:0}
.row b{display:block;font-weight:600;font-size:16.5px}
.row span{display:block;color:var(--dim);font-size:14px;line-height:1.3;margin-top:2px}
.switch{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--cell);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--pen)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.seg{display:flex;background:var(--key);border-radius:11px;padding:3px;margin:8px 0 4px}
.seg button{flex:1;padding:9px 6px;border-radius:8px;font-size:15px;font-weight:500;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--cell);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 4px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13.5px;color:var(--dim);padding:6px 0;border-radius:10px}
.swatch i{width:46px;height:46px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:20px;border:2px solid transparent;outline:1px solid var(--line)}
.swatch[aria-pressed="true"]{color:var(--ink);font-weight:700}
.swatch[aria-pressed="true"] i{outline:3px solid var(--pen);outline-offset:2px}
.pens{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 4px}
.pens button{width:40px;height:40px;border-radius:50%;border:2px solid var(--surface);outline:1px solid var(--line)}
.pens button[aria-pressed="true"]{outline:3px solid var(--ink)}
table.stats{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
table.stats th{font-weight:600;color:var(--dim);text-align:right;padding:6px 4px;font-size:13.5px;border-bottom:1px solid var(--line)}
table.stats th:first-child,table.stats td:first-child{text-align:left;font-weight:700}
table.stats td{text-align:right;padding:10px 4px;border-bottom:1px solid var(--line)}
dl.facts{display:grid;grid-template-columns:1fr auto;gap:0;margin:10px 0 0}
dl.facts dt,dl.facts dd{padding:10px 0;border-bottom:1px solid var(--line);margin:0;font-size:16.5px}
dl.facts dt{color:var(--dim)}
dl.facts dd{font-weight:700;text-align:right}
ul.plain{margin:6px 0;padding-left:20px;font-size:15.5px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--given);color:var(--cell);padding:11px 16px;border-radius:12px;font-size:15.5px;font-weight:600;z-index:30;max-width:88vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen">
    <div class="home-top">
      <div>
        <h1>Sudoku</h1>
        <p class="tag">No ads and no account. Your games stay on this device.</p>
      </div>
      <div style="display:flex">
        <button class="icon-btn" id="home-stats" aria-label="Statistics"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></button>
        <button class="icon-btn" id="home-settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></button>
      </div>
    </div>
    <div id="resume-slot"></div>
    <h2 class="section">New puzzle</h2>
    <ul class="levels" id="levels"></ul>
    <button class="textlink" id="home-how">How difficulty is measured</button>
  </section>

  <section id="game" class="screen" hidden>
    <header class="bar">
      <button class="icon-btn" id="g-back" aria-label="Back to menu"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="bar-mid"><div class="bar-level" id="g-level"></div><div class="bar-sub" id="g-sub"></div></div>
      <div class="timer" id="g-timer" aria-label="Time"></div>
      <button class="icon-btn" id="g-pause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
      <button class="icon-btn" id="g-more" aria-label="Puzzle menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
    </header>
    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>
      <div class="cover" id="cover" hidden></div>
    </div>
    <div class="controls" id="controls">
      <div class="tools">
        <button class="tool" id="t-undo"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 010 12"/></svg>Undo</button>
        <button class="tool" id="t-redo"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 000 12"/></svg>Redo</button>
        <button class="tool" id="t-erase"><svg viewBox="0 0 24 24"><path d="M8 19h12M5.5 15.5l9-9a2 2 0 012.8 0l2.2 2.2a2 2 0 010 2.8L12 19H8.5l-3-3a.4.4 0 010-.5z"/></svg>Erase</button>
        <button class="tool" id="t-notes" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 012.8 0l.2.2a2 2 0 010 2.8L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/></svg><span id="t-notes-label">Notes</span></button>
        <button class="tool" id="t-hint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>Hint</button>
      </div>
      <div class="pad" id="pad"></div>
    </div>
    <div class="hintbox" id="hintbox" hidden></div>
  </section>
</div>
<div class="backdrop" id="backdrop" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script id="engine-src">

    menuItem('m-clear', 'Clear all notes', 'M4 4h16v16H4zM9 9l6 6M15 9l-6 6', function () { closeSheet(); if (inPlay()) clearNotes(); }),
    menuItem('m-restart', 'Restart this puzzle', 'M4 12a8 8 0 108-8H7M10 1L7 4l3 3', function () {
      openSheet('Restart this puzzle?', [el('p', { text: 'Your digits, notes and time will be cleared.' }),
        el('button', { class: 'btn primary', id: 'restart-yes', text: 'Restart', on: { click: restart } }), el('button', { class: 'btn', text: 'Keep playing', on: { click: closeSheet } })]);
    }),
    menuItem('m-new', 'New puzzle', 'M12 5v14M5 12h14', function () { levelSheet(); }),
    menuItem('m-about', 'About this puzzle', 'M12 11v6M12 7.5v.5M12 3a9 9 0 100 18 9 9 0 000-18z', aboutSheet),
    menuItem('m-settings', 'Settings', 'M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4', settingsSheet)
  ]);
}
function levelSheet() {
  var nodes = LEVELS.map(function (l) { return el('button', { class: 'btn', 'data-level': l.key, text: l.name, on: { click: function () { askNew(l.key); } } }); });
  openSheet('New puzzle', nodes);
}
function aboutSheet() {
  var m = game.meta, list = el('ul', { class: 'plain' });
  E.TECHS.forEach(function (t) { if (m.counts[t.id]) list.appendChild(el('li', { text: t.name + ' × ' + m.counts[t.id] })); });
  openSheet('About this puzzle', [
    facts([['Level', levelOf(game).name], ['Givens', String(m.givenCount)], ['Difficulty score', m.score.toLocaleString('en-GB')], ['Solutions', 'Exactly one'], ['Puzzle number', (m.seed >>> 0).toString(16).toUpperCase()]]),
    el('h3', { text: 'Steps a careful solver needs' }), list
  ]);
}
function howSheet() {
  var ul = el('ul', { class: 'plain' });
  LEVELS.forEach(function (l) { ul.appendChild(el('li', null, el('b', { text: l.name + '. ' }), l.blurb)); });
  openSheet('How difficulty is measured', [
    el('p', { text: 'The number of givens is a poor guide to how hard a puzzle feels. What matters is the hardest technique you need, and how often you need it.' }),
    el('p', { text: 'Every new puzzle is solved by a built-in solver that works like a person: it always tries the easiest technique first. The level is set by the hardest technique it was forced to use, and a score adds up the cost of every step.' }),
    ul,
    el('p', { class: 'dim', text: 'Each puzzle has exactly one solution and never needs guessing. It is also compared with the last 20 puzzles you were given, so the same grid, pattern or mix of digits does not come back.' })
  ]);
}
function statsSheet() {
  var table = el('table', { class: 'stats' }), head = el('tr');
  ['Level', 'Played', 'Won', 'Best', 'Average', 'Streak'].forEach(function (h) { head.appendChild(el('th', { text: h })); });
  table.appendChild(head);
  var any = false;
  LEVELS.forEach(function (l) {
    var s = stats[l.key] || { played: 0, won: 0, best: 0, total: 0, streak: 0 }, tr = el('tr');
    if (s.played) any = true;
    [l.name, s.played, s.won, s.best ? fmtTime(s.best) : '–', s.won ? fmtTime(s.total / s.won) : '–', s.streak].forEach(function (v) { tr.appendChild(el('td', { text: String(v) })); });
    table.appendChild(tr);
  });
  openSheet('Statistics', [any ? null : el('p', { class: 'dim', text: 'Nothing yet. Finish a puzzle and your times appear here.' }), table,
    el('button', { class: 'btn danger', id: 'stats-reset', text: 'Reset statistics', on: { click: function () {
      openSheet('Reset statistics?', [el('p', { text: 'All times, wins and streaks will be cleared. Your current puzzle is kept.' }),
        el('button', { class: 'btn primary', id: 'stats-reset-yes', text: 'Reset', on: { click: function () { stats = {}; saveStats(); closeSheet(); renderHome(); toast('Statistics reset.'); } } }),
        el('button', { class: 'btn', text: 'Cancel', on: { click: statsSheet } })]);
    } } })]);
}
function seg(id, options, value, onPick) {
  var wrap = el('div', { class: 'seg', id: id });
  options.forEach(function (o) {
    wrap.appendChild(el('button', { 'data-v': String(o[0]), 'aria-pressed': o[0] === value ? 'true' : 'false', text: o[1], on: { click: function () { onPick(o[0]); } } }));
  });
  return wrap;
}
function toggleRow(id, key, title, desc) {
  var sw = el('button', { class: 'switch', id: id, role: 'switch', 'aria-checked': settings[key] ? 'true' : 'false', 'aria-label': title });
  sw.addEventListener('click', function () { settings[key] = !settings[key]; sw.setAttribute('aria-checked', settings[key] ? 'true' : 'false'); saveSettings(); if (key === 'input') armed = 0; if (game) renderGame(); });
  return el('div', { class: 'row' }, el('div', null, el('b', { text: title }), desc ? el('span', { text: desc }) : null), sw);
}
function settingsSheet() {
  var keep = $('#sheet').scrollTop;
  function again() { saveSettings(); applyTheme(); if (game && screen === 'game') renderGame(); settingsSheet(); $('#sheet').scrollTop = keep; }
  var sw = el('div', { class: 'swatches', id: 'themes' });
  THEMES.forEach(function (t) {
    var probe = el('i', { 'data-theme': t.id, text: '5' });
    probe.style.cssText = 'background:var(--cell);color:var(--pen);border-color:var(--page)';
    sw.appendChild(el('button', { class: 'swatch', 'data-v': t.id, 'aria-pressed': settings.theme === t.id ? 'true' : 'false', on: { click: function () { settings.theme = t.id; keep = $('#sheet').scrollTop; again(); } } }, probe, t.name));
  });
  var pens = el('div', { class: 'pens', id: 'pens' }), dark = themeObj().dark;
  PENS.forEach(function (p) {
    var b = el('button', { 'data-v': p.id, 'aria-label': p.name, 'aria-pressed': settings.pen === p.id ? 'true' : 'false', on: { click: function () { settings.pen = p.id; keep = $('#sheet').scrollTop; again(); } } });
    b.style.background = p.id === 'theme' ? 'conic-gradient(var(--given) 0 50%, var(--cell) 0)' : (dark ? p.dark : p.light);
    pens.appendChild(b);
  });
  var checkNote = { off: 'Nothing is checked, like pencil and paper.', conflicts: 'A digit turns red when it repeats in its row, column or box.', solution: 'A wrong digit turns red straight away and counts as a mistake.' }[settings.check];
  var nodes = [
    el('h3', { text: 'Background' }), sw,
    el('h3', { text: 'Your digits' }),
    seg('s-digits', [['weight', 'Lighter'], ['colour', 'Coloured']], settings.digits, function (v) { settings.digits = v; keep = $('#sheet').scrollTop; again(); }),
    el('p', { class: 'dim', text: settings.digits === 'colour' ? 'Your digits take the accent colour. Givens stay bold.' : 'Givens are heavy and your digits are light, in the same colour.' }),
    el('h3', { text: 'Accent colour' }), pens,
    el('p', { class: 'dim', text: 'Used for the keypad, the selection and highlighted notes' + (settings.digits === 'colour' ? ', and for your digits.' : '.') }),
    el('h3', { text: 'Checking' }),
    seg('s-check', [['off', 'None'], ['conflicts', 'Duplicates'], ['solution', 'Every digit']], settings.check, function (v) { settings.check = v; keep = $('#sheet').scrollTop; again(); }),
    el('p', { class: 'dim', text: checkNote })
  ];
  if (settings.check === 'solution') {
    nodes.push(el('h3', { text: 'Mistakes allowed' }));
    nodes.push(seg('s-limit', [[0, 'No limit'], [1, '1'], [3, '3'], [5, '5']], settings.limit, function (v) { settings.limit = v; keep = $('#sheet').scrollTop; again(); }));
    nodes.push(el('p', { class: 'dim', text: settings.limit ? 'The puzzle ends when you reach ' + settings.limit + (settings.limit === 1 ? ' mistake.' : ' mistakes.') : 'Mistakes are counted but never end the puzzle.' }));
  }
  nodes.push(el('h3', { text: 'Entering digits' }));
  nodes.push(seg('s-input', [['cell', 'Cell first'], ['digit', 'Digit first']], settings.input, function (v) { settings.input = v; armed = 0; keep = $('#sheet').scrollTop; again(); }));
  nodes.push(el('p', { class: 'dim', text: settings.input === 'cell' ? 'Tap a cell, then a digit.' : 'Tap a digit to hold it, then tap every cell it goes in.' }));
  nodes.push(el('h3', { text: 'Help on the board' }));
  nodes.push(toggleRow('s-peers', 'hlPeers', 'Highlight row, column and box', 'Shades the cells that share a unit with the one you picked.'));
  nodes.push(toggleRow('s-same', 'hlSame', 'Highlight matching digits', 'Also marks the same digit inside your notes.'));
  nodes.push(toggleRow('s-auto', 'autoNotes', 'Tidy notes automatically', 'Placing a digit removes it from notes in the same row, column and box.'));
  nodes.push(toggleRow('s-start', 'startNotes', 'Start with notes filled in', 'Every new puzzle opens with all candidates pencilled in.'));
  nodes.push(toggleRow('s-fade', 'fadeDone', 'Fade finished digits', 'A digit that is on the board nine times is dimmed on the keypad.'));
  nodes.push(toggleRow('s-timer', 'timer', 'Show the timer', 'Time is still recorded for your statistics when hidden.'));
  openSheet('Settings', nodes);
}

/* ---------- clock ---------- */
var lastTick = Date.now(), lastSave = 0;
setInterval(function () {
  var now = Date.now(), dt = Math.min(now - lastTick, 1000); lastTick = now;
  if (!inPlay() || paused || screen !== 'game' || document.hidden || !$('#backdrop').hidden) return;
  game.elapsed += dt;
  $('#g-timer').textContent = fmtTime(game.elapsed);
  if (now - lastSave > 5000) { lastSave = now; saveGame(); }
}, 250);
document.addEventListener('visibilitychange', function () { lastTick = Date.now(); if (document.hidden && game) saveGame(); });
window.addEventListener('pagehide', function () { if (game) saveGame(); });

/* ---------- wiring ---------- */
buildBoard(); applyTheme();
$('#home-stats').addEventListener('click', statsSheet);
$('#home-settings').addEventListener('click', settingsSheet);
$('#home-how').addEventListener('click', howSheet);
$('#g-back').addEventListener('click', function () { if (busy) return; paused = false; hintState = null; if (game) saveGame(); show('home'); });
$('#g-pause').addEventListener('click', function () { if (!inPlay()) return; paused = !paused; hintState = null; renderGame(); });
$('#g-more').addEventListener('click', function () { if (game && !busy) moreSheet(); });
$('#t-undo').addEventListener('click', undo);
$('#t-redo').addEventListener('click', redo);
$('#t-erase').addEventListener('click', erase);
$('#t-notes').addEventListener('click', function () { if (!inPlay()) return; noting = !noting; renderGame(); });
$('#t-hint').addEventListener('click', askHint);
$('#backdrop').addEventListener('click', function (e) { if (e.target === this) closeSheet(); });
document.addEventListener('keydown', function (e) {
  if (screen !== 'game' || !inPlay() || !$('#backdrop').hidden) return;
  var k = e.key;
  if (k >= '1' && k <= '9') { if (settings.input === 'digit') tapKey(+k); else if (sel >= 0) { if (noting) toggleNote(sel, +k); else placeDigit(sel, +k); } }
  else if (k === 'Backspace' || k === 'Delete' || k === '0') erase();
  else if (k === 'n' || k === 'N') { noting = !noting; renderGame(); }
  else if ((k === 'z' || k === 'Z') && (e.ctrlKey || e.metaKey)) { if (e.shiftKey) redo(); else undo(); }
  else if (k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight') {
    if (sel < 0) sel = 40;
    else if (k === 'ArrowUp' && ROW[sel] > 0) sel -= 9; else if (k === 'ArrowDown' && ROW[sel] < 8) sel += 9;
    else if (k === 'ArrowLeft' && COL[sel] > 0) sel -= 1; else if (k === 'ArrowRight' && COL[sel] < 8) sel += 1;
    renderGame();
  } else return;
  e.preventDefault();
});

// a saved game from an older or damaged save is dropped rather than trusted
if (game && !(game.givens && game.solution && game.values && game.values.length === 81 && E.isValidSolution(game.solution))) { game = null; saveGame(); }
show('home');
LEVELS.forEach(function (l, n) { setTimeout(function () { stockSpare(l.key); }, 600 + n * 400); });

window.__sudoku = { get game() { return game; }, get settings() { return settings; }, get stats() { return stats; }, get history() { return history; }, get spare() { return spare; }, get sel() { return sel; }, E: E };
})();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
</script>
